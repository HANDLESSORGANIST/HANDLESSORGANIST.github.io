function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var err=document.getElementById('err'); err.textContent='decrypting...';
  try{
    var raw=b64(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    var pw=document.getElementById('pw').value;
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    var html=new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(ex){ err.textContent='wrong password'; document.getElementById('pw').value=''; }
});
